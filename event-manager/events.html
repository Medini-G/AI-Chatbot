<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Events — Marquee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">Marquee<span class="dot">.</span></a>
    <button class="nav-burger" id="navBurger">☰</button>
    <div class="nav-links nav-menu" id="navMenu">
      <a href="index.html">Home</a>
      <a href="events.html" class="active">Events</a>
      <a href="my-bookings.html" data-auth="user">My Bookings</a>
      <a href="admin.html" data-auth="admin">Admin</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" data-auth="guest">Login / Register</a>
      <span class="nav-user" data-auth="user">Hi, <span id="navUserName"></span></span>
      <a href="#" id="navLogout" data-auth="user">Logout</a>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">☾</button>
    </div>
  </div>
</nav>

<header class="hero" style="padding:56px 0;">
  <div class="container hero-inner">
    <span class="eyebrow">// Box office</span>
    <h1 style="font-size: clamp(2.2rem, 5vw, 3.2rem);">All events</h1>
    <p class="lead">Search, filter, and sort every event currently on sale.</p>
  </div>
</header>

<main class="section container">
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search by title or location…" style="min-width:220px; flex:1;">
    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
    <select id="sortSelect">
      <option value="date-asc">Date: soonest first</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="seats-asc">Seats: fewest left</option>
    </select>
  </div>

  <div id="resultCount" style="margin-bottom:18px; font-size:0.85rem; color:var(--ink-soft);"></div>
  <div class="event-grid" id="eventsGrid"></div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 Marquee Events.</span>
    <span>No backend — all data stored locally in your browser.</span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
</body>
</html>
